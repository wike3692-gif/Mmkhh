  const allKeys = Object.keys(DB);

  let score,sales,price,rating,works,comp,tags,suggs;

  if (e) {
    score = clamp(Math.round(jit(e.b,5)),0,100);
    sales = Math.max(0,Math.round(jit(e.s,e.s*.15)));
    price = Math.max(100,Math.round(jit(e.p,e.p*.1)/10)*10);
    rating = clamp(+jit(e.r,.2).toFixed(1),1,5);
    works = Math.max(1,Math.round(jit(score*2.5,30)));
    comp = COMP_LABEL[e.c]||"中";
    tags = (TAGS_REL[kw]||[]).slice();
    while(tags.length<9){ const p=allKeys[Math.random()*allKeys.length|0]; if(p!==kw&&!tags.includes(p)) tags.push(p); }
    suggs = SUGG_DB[kw] || [`${kw} 人気`,`${kw} おすすめ`,`${kw} 新作`,`${kw} ランキング`,`${kw} 無料`];
  } else {
    const h=[...kw].reduce((a,c)=>a+c.charCodeAt(0),0);
    score=clamp((h%60)+15+Math.round(jit(0,10)),5,100);
    sales=Math.max(10,Math.round(score*jit(5.5,2)));
    price=Math.max(100,Math.round(jit(770,300)/10)*10);
    rating=clamp(+jit(3.8,.5).toFixed(1),2,5);
    works=Math.max(1,Math.round(score*jit(2,1)));
    comp=score>70?"高 (人気市場)":score>45?"中 (成長市場)":score>25?"低〜中":"低 (ニッチ市場)";
    tags=[];
    for(let i=0;i<9;i++){const p=allKeys[(h+i*7)%allKeys.length]; if(!tags.includes(p))tags.push(p);}
    suggs=[`${kw} 人気`,`${kw} おすすめ`,`${kw} 新作`,`${kw} ランキング`,`${kw} 同人`];
  }

  const recs = [];
  if(score>=70) recs.push({i:"🔥",t:"需要が高いキーワードです。品質で差別化を図り、上位作品との差を明確にしましょう。"});
  else if(score>=40) recs.push({i:"💡",t:"中程度の需要があります。ニッチな切り口やユニークな要素で勝負できます。"});
  else recs.push({i:"🔍",t:"需要は限定的です。複合キーワードで訴求範囲を広げることを検討してください。"});
  if(sales>400) recs.push({i:"📈",t:`平均${sales}DLと市場が活発です。定期的な新作投入で認知度を高めましょう。`});
  else recs.push({i:"📣",t:"販売数は控えめです。SNSやサンプルの充実でプロモーション強化を。"});
  if(price>1000) recs.push({i:"💰",t:`平均価格¥${price.toLocaleString()}。ボリュームや付加価値のある作品が求められています。`});
  else recs.push({i:"🎁",t:`平均価格¥${price.toLocaleString()}。手軽な価格帯でもチャンスがあります。`});
  if(comp.startsWith("高")) recs.push({i:"⚠️",t:"競争が激しいため、独自性・クオリティ・タグ戦略が勝敗を分けます。"});
  else recs.push({i:"✨",t:"競争が少ない市場です。先行者利益を狙える可能性があります。"});
  if(tags.length) recs.push({i:"🏷️",t:`関連タグ「${tags.slice(0,4).join("・")}」との組み合わせが効果的です。`});

  return {keyword:kw,demandScore:score,workCount:works,avgSales:sales,avgPrice:price,avgRating:rating,competition:comp,tags:tags.slice(0,10),suggestions:suggs,recs};
}

// =========================================================================
// STATE & DOM
// =========================================================================
let currentResult = null;
let history = [];
let activeTab = 'analyze';

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const show = el => el.classList.remove('hidden');
const hide = el => el.classList.add('hidden');

function scoreColor(s){ return s>=65?'var(--green)':s>=35?'var(--yellow)':'var(--red)'; }
function scoreCls(s){ return s>=65?'hi':s>=35?'md':'lo'; }
function compColor(c){ return c.startsWith('高')?'var(--red)':c.startsWith('中')?'var(--yellow)':'var(--green)'; }

// =========================================================================
// RENDER
// =========================================================================
function renderResults(r) {
  const v = $('#resultsView');
  const sc = scoreCls(r.demandScore);
  const scolor = scoreColor(r.demandScore);
  const cc = compColor(r.competition);

  v.innerHTML = `
    <!-- Stats -->
    <div class="panel">
      <div class="p-head">📊 STATISTICS</div>
      <div class="p-body">
        <div class="stats">
          <div class="st"><div class="st-v c">${r.workCount}</div><div class="st-l">WORKS</div></div>
          <div class="st"><div class="st-v m">¥${r.avgPrice.toLocaleString()}</div><div class="st-l">AVG PRICE</div></div>
          <div class="st"><div class="st-v g">${r.avgSales.toLocaleString()}</div><div class="st-l">AVG DOWNLOADS</div></div>
          <div class="st"><div class="st-v y">★${r.avgRating}</div><div class="st-l">AVG RATING</div></div>
        </div>
        <div class="d-hdr">
          <span class="d-lbl">DEMAND SCORE</span>
          <span class="d-val" style="color:${scolor};text-shadow:0 0 15px ${scolor}">${r.demandScore}</span>
        </div>
        <div class="d-track"><div class="d-fill ${sc}" style="width:${r.demandScore}%"></div></div>
      </div>
    </div>

    <!-- Competition -->
    <div class="panel">
      <div class="p-head">🎯 COMPETITION</div>
      <div class="p-body">
        <div style="text-align:center;padding:.8rem 0">
          <div style="font:700 .88rem var(--ff-d);color:${cc};text-shadow:0 0 10px ${cc};letter-spacing:1px">${r.competition}</div>
          <div style="font:.68rem var(--ff-m);color:var(--txt2);margin-top:.6rem;line-height:1.6">
            KEYWORD: "${r.keyword}"<br>WORKS: ${r.workCount} | DL: ${r.avgSales.toLocaleString()}
          </div>
        </div>
        <div class="tags" style="margin-top:.8rem">
          ${r.tags.map((t,i)=>`<span class="tg ${i<2?'hot':i<5?'warm':'cool'}" style="animation-delay:${i*.05}s">${t}</span>`).join('')}
        </div>
      </div>
    </div>

    <!-- Suggestions -->
    <div class="panel">
      <div class="p-head">🔍 SUGGESTIONS</div>
      <div class="p-body">
        ${r.suggestions.map((s,i)=>`<div class="sug" style="animation-delay:${i*.04}s"><span class="num">0${i+1}</span>${s}</div>`).join('')}
      </div>
    </div>

    <!-- Recs -->
    <div class="panel full">
      <div class="p-head">📝 RECOMMENDATIONS</div>
      <div class="p-body">
        ${r.recs.map((rc,i)=>`<div class="rec" style="animation-delay:${i*.08}s"><span style="font-size:1.05rem;flex-shrink:0">${rc.i}</span><span>${rc.t}</span></div>`).join('')}
      </div>
    </div>
  `;
  show(v);
}

function renderCompare() {
  if(history.length < 2) return;
  const cv = $('#compareView');
  const sorted = [...history].sort((a,b)=>b.demandScore-a.demandScore);
  const mx = Math.max(...sorted.map(r=>r.demandScore));

  cv.innerHTML = `
    <div class="panel full" style="animation:fadeUp .4s ease-out">
      <div class="p-head">📊 KEYWORD COMPARISON</div>
      <div class="p-body" style="overflow-x:auto">
        <table class="cmp-tbl">
          <thead><tr><th>KEYWORD</th><th>SCORE</th><th>WORKS</th><th>AVG DL</th><th>AVG PRICE</th><th>RATING</th><th>COMPETITION</th></tr></thead>
          <tbody>
            ${sorted.map(r=>{
              const bc=scoreColor(r.demandScore);
              return `<tr>
                <td class="kw">${r.keyword}</td>
                <td>${r.demandScore}<span class="minibar" style="width:${(r.demandScore/mx)*55}px;background:${bc};box-shadow:0 0 4px ${bc}"></span></td>
                <td>${r.workCount}</td>
                <td>${r.avgSales.toLocaleString()}</td>
                <td>¥${r.avgPrice.toLocaleString()}</td>
                <td>★${r.avgRating}</td>
                <td>${r.competition}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderHistory() {
  const hp = $('#historyPanel');
  const hl = $('#historyList');
  if(!history.length){ hide(hp); return; }
  show(hp);
  hl.innerHTML = history.map(h=>{
    const c=scoreColor(h.demandScore);
    return `<div class="hist" data-kw="${h.keyword}"><span class="kw">${h.keyword}</span><span class="sc" style="color:${c}">${h.demandScore}/100</span></div>`;
  }).join('');
  hl.querySelectorAll('.hist').forEach(el=>{
    el.addEventListener('click',()=>runAnalysis(el.dataset.kw));
  });
}

function switchTab(tab) {
  activeTab = tab;
  $$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  if(tab==='analyze'){
    if(currentResult){ show($('#resultsView')); renderResults(currentResult); }
    hide($('#compareView'));
  } else {
    hide($('#resultsView'));
    renderCompare();
    show($('#compareView'));
  }
}

// =========================================================================
// RUN
// =========================================================================
function runAnalysis(kw) {
  const keyword = kw || $('#kwInput').value.trim();
  if(!keyword) return;
  $('#kwInput').value = keyword;

  // Show loading
  hide($('#welcomeView'));
  hide($('#resultsView'));
  hide($('#compareView'));
  show($('#loader'));
  const btn = $('#analyzeBtn');
  btn.disabled = true;
  btn.textContent = 'SCANNING...';
  btn.classList.add('spin-border');

  const delay = 600 + Math.random()*1000;
  setTimeout(()=>{
    const res = analyze(keyword);
    currentResult = res;

    // Update history
    history = [res, ...history.filter(h=>h.keyword!==res.keyword)].slice(0,20);

    // Hide loading
    hide($('#loader'));
    btn.disabled = false;
    btn.textContent = 'ANALYZE';
    btn.classList.remove('spin-border');

    // Show tabs
    show($('#tabBar'));
    $('#cmpCount').textContent = history.length;
    if(history.length<2) $('#cmpTab').disabled = true;
    else $('#cmpTab').disabled = false;

    // Render
    activeTab = 'analyze';
    switchTab('analyze');
    renderHistory();
  }, delay);
}

// =========================================================================
// INIT
// =========================================================================
(function init() {
  // Quick tags
  const qt = $('#quickTags');
  QUICK.forEach(tag=>{
    const b = document.createElement('button');
    b.className='qtag'; b.textContent=tag;
    b.addEventListener('click',()=>runAnalysis(tag));
    qt.appendChild(b);
  });

  // Form
  $('#searchForm').addEventListener('submit',e=>{ e.preventDefault(); runAnalysis(); });

  // Tabs
  $$('.tab').forEach(t=>{
    t.addEventListener('click',()=>{ if(!t.disabled) switchTab(t.dataset.tab); });
  });

  // Focus
  $('#kwInput').focus();
})();
</script>
</body>
</html>
